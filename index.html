<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b50"><title>損得比較ナビ｜実質時給・転職比較</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f8fc;color:#122744}header{background:#102b50;color:white;padding:20px 16px}header strong{font-size:23px}.wrap{max-width:1000px;margin:auto;padding:18px 14px}.hero{padding:22px 4px}.hero h1{font-size:clamp(25px,5vw,38px);margin:0 0 10px}.hero p{line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:white;border-radius:30px;padding:8px 13px;color:#21538e;font-size:13px}.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{border-radius:17px;background:#e7f2ff;padding:18px;box-shadow:0 3px 14px #0b315012}.panel.next{background:#e8f9ee}.panel h2{font-size:21px;margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}.field small{font-weight:400;color:#576779}.field input{width:100%;font-size:18px;border:1px solid #c6d5e5;border-radius:10px;padding:12px;background:white;color:#122744}.field input:focus{outline:3px solid #86b8fa}.actions{display:flex;gap:10px;justify-content:center;margin:24px 0}.actions button{border:0;border-radius:30px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,#12a7c0,#2b56df);color:white}.secondary{background:white;color:#194779;border:1px solid #cbddeb!important}.result{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #0b315012}.result h2{background:#123c72;color:white;margin:0;padding:16px 20px}.resultBody{padding:18px}.winner{text-align:center;background:#eaf8e8;border-radius:12px;padding:14px;font-weight:750}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.stat{padding:15px;border-radius:12px;background:#edf6ff}.stat.next{background:#e9faef}.stat strong{font-size:29px;display:block;margin:6px 0}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.diff{border:1px solid #dce5ef;border-radius:12px;padding:13px;text-align:center}.diff strong{display:block;font-size:20px;margin-top:6px}.note{font-size:13px;color:#566579;line-height:1.7}.ad{margin:24px 0 10px;border:1px dashed #c5d2df;border-radius:12px;padding:18px;color:#7d8b9c;text-align:center;background:#f8fafc;font-size:13px}footer{text-align:center;color:#65768a;padding:30px 10px;font-size:12px}@media(max-width:650px){.forms{grid-template-columns:1fr}.diffs{grid-template-columns:1fr}.stats strong{font-size:24px}.wrap{padding:12px}.panel{padding:16px}.actions button{flex:1;padding:14px 8px}}</style></head><body><header><div style="max-width:1000px;margin:auto"><strong>⚖ 損得比較ナビ</strong><div style="font-size:12px;opacity:.85">仕事・お金・時間の「損得」をカンタン比較</div></div></header><main class="wrap"><section class="hero"><h1>実質時給・転職比較ツール</h1><p>今の仕事と転職先を比べて、手取り・時間効率・自由時間の違いを確認できます。</p><div class="chips"><span>⚡ 1分で比較</span><span>📱 スマホ対応</span><span>¥ 無料</span><span>🔒 登録不要</span></div></section><div class="forms"><section class="panel"><h2>💼 現在の仕事</h2><div id="current"></div></section><section class="panel next"><h2>📈 転職先（候補）</h2><div id="future"></div></section></div><div class="actions"><button class="primary" id="calculate">比較する</button><button class="secondary" id="reset">リセット</button></div><section class="result" id="result" aria-live="polite"><h2>▥ 比較結果</h2><div class="resultBody" id="resultBody"></div></section><div class="ad">広告掲載予定エリア（現在は広告なし）</div><p class="note">※このツールは概算です。賞与・税制・福利厚生・将来の昇給・仕事内容などは考慮していません。通勤時間は往復で入力してください。自己負担額が空欄の場合は0円として計算します。</p></main><footer>© 損得比較ナビ｜試作品</footer><script>const fields=[['pay','月の手取り給与（円）',true],['days','月の勤務日数（日）',true],['hours','1日の拘束時間・休憩込み（時間）',true],['commute','1日の往復通勤時間（分）',false],['cost','月の仕事関連自己負担（円）',false]];const defaults={current:{pay:270000,days:22,hours:11,commute:60,cost:''},future:{pay:300000,days:22,hours:9,commute:40,cost:''}};for(const side of ['current','future']){document.getElementById(side).innerHTML=fields.map(([key,label,required])=>`<div class="field"><label for="${side}-${key}">${label} <small>${required?'必須':'任意・予想値でOK'}</small></label><input id="${side}-${key}" type="number" inputmode="decimal" min="0" step="any" ${required?'required':''} value="${defaults[side][key]}"></div>`).join('')}function read(side){let obj={};for(const [key,,required] of fields){const raw=document.getElementById(`${side}-${key}`).value.trim();if(required&&!raw)return null;const n=raw===''?0:Number(raw);if(!Number.isFinite(n)||n<0)return null;obj[key]=n}if(obj.days<=0||obj.hours<=0)return null;obj.time=obj.days*(obj.hours+obj.commute/60);obj.net=obj.pay-obj.cost;obj.rate=obj.net/obj.time;return obj}const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';function render(){const a=read('current'),b=read('future'),el=document.getElementById('resultBody');if(!a||!b){el.innerHTML='<p role="alert">入力を確認してください。必須項目は0より大きい値を入力してください（給与は0円でも計算可能です）。</p>';return}const diff=b.rate-a.rate;const winner=Math.abs(diff)<.005?'実質時給はほぼ同じです':diff>0?'転職先の方が実質時給が高いです！':'現在の仕事の方が実質時給が高いです';el.innerHTML=`<div class="winner">${winner}</div><div class="stats"><div class="stat">現在の仕事<strong>${yen(a.rate)}</strong><small>月の仕事関連時間 ${a.time.toFixed(1)}時間</small></div><div class="stat next">転職先<strong>${yen(b.rate)}</strong><small>月の仕事関連時間 ${b.time.toFixed(1)}時間</small></div></div><div class="diffs"><div class="diff">実質時給の差<strong>${diff>=0?'+':''}${yen(diff)}/時</strong></div><div class="diff">月の手残りの差<strong>${b.net-a.net>=0?'+':''}${yen(b.net-a.net)}</strong></div><div class="diff">仕事関連時間の差<strong>${b.time-a.time>0?'+':''}${(b.time-a.time).toFixed(1)}時間/月</strong></div></div><p class="note">実質時給＝（月の手取り－仕事関連自己負担）÷［勤務日数×（拘束時間＋往復通勤時間）］。入力値に基づく概算です。</p>`}document.getElementById('calculate').addEventListener('click',()=>{render();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('reset').addEventListener('click',()=>{for(const side of ['current','future'])for(const [key] of fields)document.getElementById(`${side}-${key}`).value=defaults[side][key];render()});document.querySelectorAll('input').forEach(input=>input.addEventListener('input',render));render();</script></body></html>
